[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogext-scan"
version = "0.1.0"
description = "Zero-dependency static analysis tool for AI agent code and tool safety."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Yamin / THRYVIX", email = "hello@cogextai.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.scripts]
cogext-scan = "cogext_scan:main"

[project.urls]
Homepage = "https://cogextai.com"
Documentation = "https://cogextai.com/standard"
Repository = "https://github.com/yaminbinyoosuf/cogext-scan"

[tool.setuptools]
py-modules = ["cogext_scan"]
